<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打地鼠 17 · 霓虹版</title>
<style>
:root{--cyan:#00f0ff;--magenta:#ff2bd6;--purple:#8b5cf6;--lime:#39ff14;--yellow:#ffe600;--bg:#05040d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;
touch-action:manipulation;
background:radial-gradient(circle at 22% 22%, rgba(255,43,214,.24), transparent 45%),
radial-gradient(circle at 78% 78%, rgba(0,240,255,.18), transparent 45%),
radial-gradient(circle at 50% 50%, #0c0a1e 0%, var(--bg) 70%);
color:#eafcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Microsoft YaHei",monospace;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,43,214,.055) 1px,transparent 1px);
background-size:44px 44px;mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px}
h1{font-size:20px;letter-spacing:.22em;margin:0 0 12px;color:#fff;
text-shadow:0 0 6px var(--magenta),0 0 18px var(--magenta),0 0 42px rgba(255,43,214,.55)}
.hud{display:flex;gap:20px;margin-bottom:14px;font-size:13px;letter-spacing:.12em;color:#ffd8f5}
.hud b{color:#fff;text-shadow:0 0 10px var(--cyan)}
.panel{padding:12px;border-radius:18px;background:rgba(10,8,26,.72);border:1px solid rgba(255,43,214,.35);
box-shadow:0 0 0 1px rgba(0,240,255,.16) inset,0 0 26px rgba(255,43,214,.28),0 0 60px rgba(0,240,255,.18)}
#box{display:grid;grid-template-columns:repeat(3,min(26vw,92px));grid-template-rows:repeat(3,min(26vw,92px));gap:12px}
.hole{background:rgba(255,255,255,.03);border:1px dashed rgba(0,240,255,.35);border-radius:16px;
display:flex;align-items:center;justify-content:center;font-size:min(11vw,40px);user-select:none;overflow:hidden;
box-shadow:inset 0 -10px 0 rgba(0,0,0,.45),inset 0 0 18px rgba(0,240,255,.1)}
.hole span{transform:translateY(120%);transition:transform .12s}
.hole.up{border-style:solid;border-color:var(--magenta);box-shadow:0 0 22px rgba(255,43,214,.55),inset 0 0 20px rgba(255,43,214,.25)}
.hole.up span{transform:translateY(0);filter:drop-shadow(0 0 10px rgba(255,43,214,.9))}
.hole.hit{border-color:var(--lime);box-shadow:0 0 24px rgba(57,255,20,.6),inset 0 0 20px rgba(57,255,20,.25)}
#msg{height:26px;margin-top:14px;font-size:13px;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.75);text-align:center}
#ctl{display:flex;gap:14px;margin-top:12px}
.btn{padding:12px 26px;border-radius:14px;border:1px solid var(--cyan);background:rgba(0,240,255,.1);color:#fff;
font-family:inherit;font-size:13px;letter-spacing:.16em;text-shadow:0 0 10px var(--cyan);
box-shadow:0 0 18px rgba(0,240,255,.4);user-select:none}
.btn.re{border-color:var(--magenta);background:rgba(255,43,214,.12);text-shadow:0 0 10px var(--magenta)}
.tip{margin-top:12px;font-size:11px;color:#7c8fb3;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>NEON WHACK</h1>
  <div class="hud">分 <b id="score">0</b>　时间 <b id="time">30</b>s　最高 <b id="best">0</b></div>
  <div class="panel"><div id="box"></div></div>
  <div id="msg">点「开始」后，30 秒内尽量多敲到地鼠！</div>
  <div id="ctl"><div class="btn" id="start">▶ 开始</div><div class="btn re" id="reset">🔄 重开</div></div>
  <div class="tip">连击加分　打空扣 3 分　越玩越快</div>
</div>
<script>
const HOLES=9;
const box=document.getElementById('box');
let holes,score,left,over,running,gameT,popT,up=[],speed,combo;
let best=+(localStorage.getItem('moleNeonBest')||0);
function build(){
  box.innerHTML='';holes=[];
  for(let i=0;i<HOLES;i++){
    const d=document.createElement('div');
    d.className='hole';
    const s=document.createElement('span');s.textContent='🐹';
    d.appendChild(s);
    d.addEventListener('touchstart',e=>{e.preventDefault();hit(i);},{passive:false});
    d.addEventListener('click',()=>hit(i));
    box.appendChild(d);holes.push(d);
  }
}
function init(){
  build();
  score=0;left=30;over=false;running=false;up=Array(HOLES).fill(0);speed=900;combo=0;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('best').textContent=best;
  document.getElementById('msg').textContent='点「开始」后，30 秒内尽量多敲到地鼠！';
  clearInterval(gameT);clearTimeout(popT);
}
function start(){
  if(running)return;
  running=true;score=0;left=30;up=Array(HOLES).fill(0);speed=900;combo=0;
  document.getElementById('msg').textContent='GO !';
  document.getElementById('score').textContent=0;
  clearInterval(gameT);clearTimeout(popT);
  gameT=setInterval(()=>{
    left--;document.getElementById('time').textContent=left;
    if(left<=0)end();
  },1000);
  pop();
}
function pop(){
  popT=setTimeout(()=>{
    if(!running)return;
    const idx=up.map((v,i)=>v?null:i).filter(i=>i!==null);
    if(idx.length){
      const i=idx[Math.floor(Math.random()*idx.length)];
      up[i]=1;holes[i].classList.add('up');
      setTimeout(()=>{
        if(up[i]){up[i]=0;holes[i].classList.remove('up');holes[i].classList.remove('hit');}
      },Math.max(420,speed-160));
    }
    speed=Math.max(340,speed-14);
    pop();
  },speed*0.6);
}
function hit(i){
  if(!running)return;
  if(up[i]){
    up[i]=0;combo++;
    const add=10+Math.min(combo,10)*2;
    score+=add;
    document.getElementById('score').textContent=score;
    holes[i].classList.remove('up');
    holes[i].classList.add('hit');
    document.getElementById('msg').textContent='+'+add+' 分'+(combo>1?'　COMBO x'+combo:'');
    setTimeout(()=>holes[i].classList.remove('hit'),140);
  }else{
    combo=0;score=Math.max(0,score-3);
    document.getElementById('score').textContent=score;
    document.getElementById('msg').textContent='MISS -3 分';
  }
}
function end(){
  running=false;over=true;
  clearInterval(gameT);clearTimeout(popT);
  up.forEach((v,i)=>{if(v)holes[i].classList.remove('up');});
  if(score>best){best=score;localStorage.setItem('moleNeonBest',best);}
  document.getElementById('best').textContent=best;
  document.getElementById('msg').textContent='⏰ TIME UP！本局 '+score+' 分，最高 '+best;
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('reset').addEventListener('click',init);
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')init();});
init();
</script>
</body>
</html>
