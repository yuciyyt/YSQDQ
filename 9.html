<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048 05 · 霓虹版</title>
<style>
:root{--cyan:#00f0ff;--magenta:#ff2bd6;--purple:#8b5cf6;--lime:#39ff14;--yellow:#ffe600;--bg:#05040d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;
touch-action:manipulation;
background:radial-gradient(circle at 15% 20%, rgba(0,240,255,.20), transparent 45%),
radial-gradient(circle at 85% 80%, rgba(255,43,214,.20), transparent 45%),
radial-gradient(circle at 50% 50%, #0c0a1e 0%, var(--bg) 70%);
color:#eafcff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Microsoft YaHei",monospace;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:linear-gradient(rgba(0,240,255,.055) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,43,214,.055) 1px,transparent 1px);
background-size:44px 44px;mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 78%)}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px}
h1{font-size:20px;letter-spacing:.24em;margin:0 0 12px;color:#fff;
text-shadow:0 0 6px var(--cyan),0 0 18px var(--cyan),0 0 42px rgba(0,240,255,.5)}
.hud{display:flex;gap:20px;margin-bottom:14px;font-size:13px;letter-spacing:.12em;color:#9ef6ff}
.hud b{color:#fff;font-size:16px;text-shadow:0 0 10px var(--magenta)}
.panel{padding:10px;border-radius:18px;background:rgba(10,8,26,.7);border:1px solid rgba(0,240,255,.32);
box-shadow:0 0 0 1px rgba(255,43,214,.16) inset,0 0 22px rgba(0,240,255,.26),0 0 60px rgba(139,92,246,.22);touch-action:none}
#box{display:grid;grid-template-columns:repeat(4,min(19vw,72px));grid-template-rows:repeat(4,min(19vw,72px));gap:8px}
.tile{display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:800;
font-size:min(6vw,24px);background:rgba(255,255,255,.03);border:1px solid rgba(0,240,255,.12);color:#2a3350}
#msg{height:22px;margin-top:10px;font-size:13px;letter-spacing:.1em;color:var(--magenta);text-shadow:0 0 10px rgba(255,43,214,.7)}
#pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:8px;margin-top:14px;touch-action:none}
#pad .k{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(0,240,255,.4);
color:#eafcff;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none}
#pad .k:active{background:rgba(0,240,255,.18);box-shadow:0 0 22px rgba(0,240,255,.6)}
#pad .sp{visibility:hidden}
#pad .mid{border-color:rgba(255,43,214,.5);color:var(--magenta);font-size:13px;text-shadow:0 0 10px var(--magenta)}
.tip{margin-top:12px;font-size:11px;color:#7c8fb3;text-align:center}
.tip span{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <h1>NEON 2048</h1>
  <div class="hud">得分 <b id="score">0</b>　最高 <b id="best">0</b></div>
  <div class="panel"><div id="box"></div></div>
  <div id="msg"></div>
  <div id="pad">
    <div class="sp"></div><div class="k" data-m="up">▲</div><div class="sp"></div>
    <div class="k" data-m="left">◀</div><div class="k mid" id="reset">重开</div><div class="k" data-m="right">▶</div>
    <div class="sp"></div><div class="k" data-m="down">▼</div><div class="sp"></div>
  </div>
  <div class="tip">点方向键，或<b>在棋盘上滑动</b></div>
</div>
<script>
const NC={2:'#00f0ff',4:'#39ff14',8:'#ffe600',16:'#ff8a00',32:'#ff2bd6',
64:'#8b5cf6',128:'#ff2d55',256:'#00ffa3',512:'#ffb800',1024:'#ff6ad5',2048:'#ffffff'};
const box=document.getElementById('box');
let grid,score=0,best=+(localStorage.getItem('g2048neonBest')||0),over=false;
function init(){grid=Array(16).fill(0);score=0;over=false;add();add();render();
  document.getElementById('msg').textContent='';}
function add(){
  const empty=grid.map((v,i)=>v?null:i).filter(i=>i!==null);
  if(!empty.length)return;
  grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<0.9?2:4;
}
function render(){
  box.innerHTML='';
  grid.forEach(v=>{
    const d=document.createElement('div');d.className='tile';
    if(v){
      const c=NC[v]||'#ffffff';
      d.textContent=v;d.style.color=c;
      d.style.fontSize=v>=1024?'min(5vw,19px)':v>=128?'min(5.6vw,22px)':'min(6vw,26px)';
      d.style.border='1px solid '+c;
      d.style.boxShadow='0 0 12px '+c+'66, 0 0 26px '+c+'33, inset 0 0 14px '+c+'22';
      d.style.textShadow='0 0 8px '+c+', 0 0 20px '+c+'aa';
    }
    box.appendChild(d);
  });
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function merge4(vals){
  const a=vals.filter(v=>v);let g=0;
  for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;g+=a[i];a.splice(i+1,1);}}
  while(a.length<4)a.push(0);
  return {a:a,g:g};
}
function lines(dir){
  const out=[];
  for(let i=0;i<4;i++){
    let idx=[];
    if(dir==='up')idx=[0,1,2,3].map(r=>r*4+i);
    if(dir==='down')idx=[3,2,1,0].map(r=>r*4+i);
    if(dir==='left')idx=[0,1,2,3].map(c=>i*4+c);
    if(dir==='right')idx=[3,2,1,0].map(c=>i*4+c);
    out.push(idx);
  }
  return out;
}
function move(dir){
  if(over)return;
  let moved=false;
  lines(dir).forEach(idx=>{
    const r=merge4(idx.map(k=>grid[k]));
    idx.forEach((k,j)=>{if(grid[k]!==r.a[j])moved=true;grid[k]=r.a[j];});
    score+=r.g;
  });
  if(moved){add();render();check();}
}
function check(){
  if(grid.some(v=>!v))return;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const i=r*4+c;
    if(c<3&&grid[i]===grid[i+1])return;
    if(r<3&&grid[i]===grid[i+4])return;
  }
  over=true;
  if(score>best){best=score;localStorage.setItem('g2048neonBest',best);}
  render();
  document.getElementById('msg').textContent='GAME OVER · SCORE '+score;
}
document.querySelectorAll('#pad .k[data-m]').forEach(b=>{
  const go=e=>{e.preventDefault();move(b.dataset.m);};
  b.addEventListener('touchstart',go,{passive:false});
  b.addEventListener('click',go);
});
document.getElementById('reset').addEventListener('click',init);
let sx=0,sy=0;
const panel=document.querySelector('.panel');
panel.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
panel.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.hypot(dx,dy)<26)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){init();return;}
  const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
  if(map[k]){move(map[k]);e.preventDefault();}
});
init();
</script>
</body>
</html>
